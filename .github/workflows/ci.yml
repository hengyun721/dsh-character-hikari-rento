name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The checks are dependency-free on purpose: no install step, so CI stays
      # meaningful even when the registry is unavailable.
      - name: Artifacts in sync + structural checks
        run: npm run verify

      # Both editions ship as release assets; each is packaged from its own
      # package directory so the tarball matches what `npm publish` would send.
      - name: Package both editions
        run: npm run pack

      - name: Tarballs stay clean
        run: |
          node -e "
            const { execFileSync } = require('node:child_process');
            const fs = require('node:fs');
            const files = fs.readdirSync('dist').filter((f) => f.endsWith('.tgz'));
            if (files.length !== 2) { console.error('expected 2 tarballs, got', files); process.exit(1); }
            console.log('tarballs:', files.join(', '));
          "

      - uses: actions/upload-artifact@v4
        if: matrix.node == 20
        with:
          name: hikari-rento-plugin
          path: |
            dist/hikari-rento-*.tgz
            !dist/hikari-rento-skill-*.tgz
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: matrix.node == 20
        with:
          name: hikari-rento-skill
          path: dist/hikari-rento-skill-*.tgz
          if-no-files-found: error
